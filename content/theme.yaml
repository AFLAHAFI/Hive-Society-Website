# Site theme: every color on the site comes from this file.
#
# Rules (see README.md → "Theme"):
#   • Keys name WHERE a color is used (a component/area), never WHAT it is.
#     ✔ navigation.background    ✘ purple, dark, h1, .btn
#   • Values are always literal hex: #rrggbb, or #rrggbbaa for transparency.
#     No references to other keys, no CSS color names.
#   • Repeating the same hex in several keys is intended. Each key can drift later
#     without untangling shared references.
#
# Each key becomes a CSS custom property: group + key joined by "-", e.g.
#   navigation.background  → var(--navigation-background)
#   teams (id: usuc) → background  → var(--teams-usuc-background)   (list entries use their `id`)
#
# Seeded from the Mobirise site as of 2026-09-23. Not wired into the CSS yet (issue #34).

navigation:
  background: "#ffffffcc" # translucent white bar
  text: "#593269"
  menu-icon: "#593269" # hamburger lines
  dropdown-background: "#ffffff"
  dropdown-text: "#593269"

page:
  background: "#ffeb69"
  text: "#593269"
  heading: "#593269"

section-band: # full-width title strips, e.g. "Executive Board"
  background: "#ffdd00"
  text: "#593269"

buttons:
  background: "#593269"
  text: "#ffffff"
  hover-background: "#76428c"
  hover-text: "#ffffff"

links:
  text: "#ffa600" # fails contrast on page.background; see docs/site-audit.md
  hover-text: "#996400"

member-cards:
  background: "#ffeb69"
  name: "#593269"
  details: "#593269"

footer:
  background: "#232323" # charcoal on every page (was purple on 5 of 7 until 2026-09-23)
  heading: "#ffffff"
  text: "#ffeb69"
  copyright: "#ffeb69"
  social-icon: "#000000"
  social-icon-background: "#ffeb69"
  social-icon-hover-background: "#ffffff"

# One entry per team. `id` must match the team's id in the team data (planned: content/teams/),
# so colors attach to the right team. To add a team: copy an entry, change `id`, pick colors.
teams:
  - id: open-mic-surgery
    background: "#ffdd00"
    text: "#593269"
  - id: twist-and-trout
    background: "#ffdd00"
    text: "#593269"
  - id: mental-chillness
    background: "#ffdd00"
    text: "#593269"
  - id: umic
    background: "#ffdd00"
    text: "#593269"
  - id: usuc
    background: "#ffdd00"
    text: "#593269"
