# Who is on which improv team. Teams are listed oldest first: the members page's Active Members
# are ordered by team (this order), then class year, then name (tests/members-order.test.mts).
#
# - members: each member's ID, which is their portrait's file name without .jpg
#   (public/assets/images/members/<id>.jpg), e.g. tess-obrien.
# - on-hiatus: members of this team taking a break. They stay on the members page as usual.
# - Executive Board members are listed on their team too; the board itself is ordered by
#   position, not team.
# - Members not on any team here sort after everyone who is. Elective teams (e.g. UMIC) aren't
#   listed: everyone on one is also on a main team.
