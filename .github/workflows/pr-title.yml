# The PR title becomes the squash-merge commit and decides the release bump (docs/RUNBOOK.md §5),
# so only the agreed Conventional Commit types are accepted.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with docs/RUNBOOK.md §5 and AGENTS.md.
          types: |
            content
            theme
            fix
            perf
            refactor
            build
            deps
            revert
            feat
            test
            ci
            docs
            style
            chore
