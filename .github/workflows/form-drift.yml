# Checks the live Google Form behind the mailing list against content/site.yaml, so a question that was
# deleted or re-created in Google Forms is caught before sign-ups silently fail.
# Network-dependent: NOT a required check (a Google outage must not block merges).
# A failed scheduled run emails whoever last edited this workflow's schedule.
name: Mailing-list form drift

on:
  schedule:
    - cron: '17 13 * * *' # daily, ~8am Central
  workflow_dispatch:
  pull_request:
    paths:
      - content/site.yaml
      - src/forms.mts
      - scripts/check-form.mts

permissions:
  contents: read

jobs:
  check:
    name: Live form matches site settings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:form
