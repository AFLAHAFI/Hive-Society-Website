# Commit prefixes follow docs/RUNBOOK.md §5: runtime/build dependencies are `deps:` (patch release);
# workflow action bumps are `ci:` (no release).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: deps }
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only, so a TypeScript 7 bump can't install (ERESOLVE)
      # and fails every check. Remove once typescript-eslint's peer range includes 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: deps }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: ci }
